name: Build & Deploy Ulpiano CCO
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Verificar archivos del portal
        run: |
          echo "Verificando estructura del portal..."
          test -f index.html || exit 1
          test -f registry.json || exit 1
          test -f viewer.js || exit 1
          test -f viewer.css || exit 1
          echo "Todos los archivos requeridos están presentes."
